plugins {
    id 'com.android.application'
}

// Bundles the web/ folder into the APK: this copy opens when there is no internet and nothing cached yet.
def webAssets = layout.buildDirectory.dir("generated/webassets")
def copyWeb = tasks.register("copyWebAssets", Copy) {
    from rootProject.file("../web")
    into webAssets.map { it.dir("web") }
}

android {
    namespace "app.citydiscovery"
    compileSdk 35

    defaultConfig {
        applicationId "app.citydiscovery"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "0.13.0"
        buildConfigField "String", "APP_URL", "\"${project.property('appUrl')}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs += webAssets.get().asFile
}

tasks.named("preBuild") { dependsOn copyWeb }
